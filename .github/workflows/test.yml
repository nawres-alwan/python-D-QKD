name: DQKD full decoy SDP audit
on:
  push:
    branches:
      - chatgpt-sdp-recalc-20260818
  pull_request:
    branches:
      - main
jobs:
  recalc:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy scipy matplotlib cvxpy clarabel
      - name: Run recalculation
        env:
          DQKD_OUT: decoy_sdp_output
        run: python recalculate_decoy_fair_acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: dqkd-decoy-sdp-recalculation
          path: decoy_sdp_output/
